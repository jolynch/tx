name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels its older run; runs on main finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run unit tests
        run: make unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      - name: Reject //nolint that could switch off depguard
        run: ./scripts/lint-nolint

  # The Makefile lists the suites (make ci-matrix), so a new one runs here
  # without editing this file.
  suites:
    runs-on: ubuntu-latest
    outputs:
      acceptance: ${{ steps.matrix.outputs.acceptance }}
      faults: ${{ steps.matrix.outputs.faults }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: make -s ci-matrix >> "$GITHUB_OUTPUT"

  # Each fuzz suite runs on its own runner.
  acceptance:
    name: acceptance (${{ matrix.suite }})
    needs: suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.acceptance) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run ${{ matrix.suite }}
        run: make ${{ matrix.suite }}

  # Each property runs on its own runner. fail-fast: false keeps the others
  # running past a failure, as make -k pbt-faults does.
  fault-injection:
    name: fault-injection (${{ matrix.suite }})
    needs: suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.faults) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run ${{ matrix.suite }}
        run: make ${{ matrix.suite }} PBT_EXCLUDE=known

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Cache Silesia corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/tx-bench/silesia
          key: silesia-v1
      - name: Disk space
        run: df -h
      - name: Run bench acceptance
        run: make bench-acceptance
      - name: Check dial budget
        run: make bench-acceptance-dials
      - name: Upload bench metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-acceptance
          path: bench/acceptance/
          if-no-files-found: ignore

  throughput:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run throughput cost ratio
        run: make bench-throughput
      - name: Upload throughput metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-throughput
          path: bench/throughput/
          if-no-files-found: ignore
