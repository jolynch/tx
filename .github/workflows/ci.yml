name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run unit tests
        run: make unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      - name: Reject //nolint that could switch off depguard
        run: ./scripts/lint-nolint

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run acceptance tests
        run: make acceptance

  fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run fault-injection properties
        run: make -k pbt-faults PBT_EXCLUDE=known

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Cache Silesia corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/tx-bench/silesia
          key: silesia-v1
      - name: Disk space
        run: df -h
      - name: Run bench acceptance
        run: make bench-acceptance
      - name: Check dial budget
        run: make bench-acceptance-dials
      - name: Upload bench metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-acceptance
          path: bench/acceptance/
          if-no-files-found: ignore

  throughput:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      - name: Run throughput cost ratio
        run: make bench-throughput
      - name: Upload throughput metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-throughput
          path: bench/throughput/
          if-no-files-found: ignore
